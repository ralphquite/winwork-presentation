<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Подключите подрядчика</title>
  </head>
  <body>
    <main class="brief-slide" data-slide-id="ctr-brief-connect">
      <span aria-label="WinWork" class="brand" role="img"></span>
      <header class="slide-header">
        <p class="step">Шаг 1 из 3</p>
        <h1>Подключите подрядчика</h1>
        <p class="lead">
          Выберите подрядчика в WinWork. Как только обе стороны подпишут
          договор, можно размещать задания через него.
        </p>
      </header>
      <div class="connect-layout">
        <figure>
          <figcaption>Откройте раздел «Мои подрядчики»</figcaption>
          <div class="figma-frame" style="aspect-ratio: 1610 / 970">
            <img
              src="../figma-brief/partners.png"
              width="1610"
              height="1139"
              data-figma-node="33:2305"
              alt="Оригинальный экран Figma «Подрядная схема» со списком и кнопкой «Добавить подрядчика»"
            />
          </div>
        </figure>
        <figure>
          <figcaption>Выберите компанию</figcaption>
          <div class="figma-frame" style="aspect-ratio: 552 / 428">
            <img
              src="../figma-brief/partner-search.png"
              width="552"
              height="1345"
              data-figma-node="33:2581"
              alt="Оригинальная панель Figma «Добавить подрядчика», поиск и первый результат"
            />
          </div>
        </figure>
        <figure>
          <figcaption>Договор подписан</figcaption>
          <div class="figma-frame" style="aspect-ratio: 552 / 552">
            <img
              src="../figma-brief/partner-signed.png"
              width="552"
              height="1345"
              data-figma-node="33:2661"
              alt="Оригинальная панель Figma с активным подрядчиком и договором, подписанным обеими сторонами"
            />
          </div>
          <p class="figure-note">Подрядчик доступен при создании задания.</p>
        </figure>
      </div>
    </main>
  </body>
</html>
