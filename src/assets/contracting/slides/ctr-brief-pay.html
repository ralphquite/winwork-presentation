<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Оплатите задание</title>
  </head>
  <body>
    <main class="brief-slide" data-slide-id="ctr-brief-pay">
      <span aria-label="WinWork" class="brand" role="img"></span>
      <header class="slide-header">
        <p class="step">Шаг 3 из 3</p>
        <h1>Оплатите задание</h1>
        <p class="lead">
          Исполнитель подтверждает выполнение в приложении, подрядчик
          подписывает с ним акт. После этого оплату можно запустить одной
          кнопкой.
        </p>
      </header>
      <div class="payment-layout">
        <figure>
          <figcaption>Веб-кабинет администратора</figcaption>
          <div
            class="figma-frame"
            style="aspect-ratio: 552 / 550; --image-offset: -24.9510763%"
          >
            <img
              src="../figma-brief/pay-web.png"
              width="552"
              height="1022"
              data-figma-node="33:2985"
              alt="Оригинальная вкладка Figma «Действия» с актом подрядчика и кнопкой «Принять и оплатить»"
            />
          </div>
        </figure>
        <figure class="payment-mobile">
          <figcaption>Приложение руководителя объекта</figcaption>
          <div
            class="figma-frame"
            style="aspect-ratio: 430 / 432; --image-offset: -4.17801998%"
          >
            <img
              src="../figma-brief/pay-mobile.png"
              width="430"
              height="1101"
              data-figma-node="33:3108"
              alt="Верхняя часть оригинального экрана Figma оплаты задания в приложении руководителя"
            />
          </div>
          <p class="crop-caption">Кнопка внизу этого экрана</p>
          <div
            class="figma-frame"
            style="aspect-ratio: 430 / 78; --image-offset: -88.6466848%"
          >
            <img
              src="../figma-brief/pay-mobile.png"
              width="430"
              height="1101"
              data-figma-node="33:3108"
              alt="Кнопка «Оплатить» в нижней части того же оригинального экрана Figma"
            />
          </div>
        </figure>
        <figure>
          <figcaption>Акт от подрядчика</figcaption>
          <div class="figma-frame" style="aspect-ratio: 552 / 365">
            <img
              src="../figma-brief/paid-document.png"
              width="552"
              height="1022"
              data-figma-node="33:3047"
              alt="Оригинальный экран Figma оплаченного задания с актом, подписанным заказчиком и подрядчиком"
            />
          </div>
        </figure>
      </div>
      <p class="pay-note">
        Исполнитель получает выплату
        <strong>от юридического лица подрядчика</strong>.
      </p>
    </main>
  </body>
</html>
