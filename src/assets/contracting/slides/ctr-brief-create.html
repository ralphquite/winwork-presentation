<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Создайте задание</title>
  </head>
  <body>
    <main class="brief-slide" data-slide-id="ctr-brief-create">
      <span aria-label="WinWork" class="brand" role="img"></span>
      <header class="slide-header">
        <p class="step">Шаг 2 из 3</p>
        <h1>Создайте задание</h1>
        <p class="lead">
          Задание создаётся в привычной форме. Для публикации через подрядчика
          выберите его в веб‑кабинете или приложении руководителя.
        </p>
      </header>
      <div class="create-layout">
        <figure class="create-web">
          <figcaption>Веб-кабинет администратора</figcaption>
          <div class="figma-frame" style="aspect-ratio: 552 / 498">
            <img
              src="../figma-brief/create-web.png"
              width="552"
              height="498"
              data-figma-node="33:2793"
              alt="Оригинальный экран Figma создания задания в веб-кабинете с выбором подрядчика"
            />
          </div>
        </figure>
        <section aria-label="Приложение руководителя">
          <h2 class="figure-title">Приложение руководителя объекта</h2>
          <div class="mobile-fragments">
            <figure>
              <figcaption>Начало формы</figcaption>
              <div class="figma-frame" style="aspect-ratio: 430 / 568">
                <img
                  src="../figma-brief/create-mobile.png"
                  width="430"
                  height="1558"
                  data-figma-node="33:2907"
                  alt="Верхняя часть оригинального экрана Figma создания задания в приложении руководителя"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Лимит и публикация</figcaption>
              <div
                class="figma-frame"
                style="aspect-ratio: 430 / 438; --image-offset: -71.8870347%"
              >
                <img
                  src="../figma-brief/create-mobile.png"
                  width="430"
                  height="1558"
                  data-figma-node="33:2907"
                  alt="Нижняя часть того же экрана Figma с остатком лимита в текущем месяце и кнопкой «Создать»"
                />
              </div>
            </figure>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
